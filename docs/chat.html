<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ouroboros — Live Interface</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #1e1e2e;
      --accent: #7c3aed;
      --accent2: #06b6d4;
      --text: #e2e8f0;
      --muted: #64748b;
      --me: #7c3aed;
      --you: #0f172a;
      --green: #10b981;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      position: relative;
    }
    .avatar-pulse {
      position: absolute; bottom: 1px; right: 1px;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--green);
      border: 2px solid var(--surface);
    }
    .avatar-pulse.offline { background: var(--red); }
    .header-info { flex: 1; }
    .header-name { font-weight: 700; font-size: 15px; }
    .header-status { font-size: 12px; color: var(--muted); }
    .header-meta {
      display: flex; gap: 16px; align-items: center;
      font-size: 12px; color: var(--muted);
    }
    .version-badge {
      background: rgba(124,58,237,0.15);
      border: 1px solid rgba(124,58,237,0.3);
      color: var(--accent);
      padding: 2px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 600;
    }
    /* Main layout */
    .main { display: flex; flex: 1; overflow: hidden; }
    /* Sidebar */
    .sidebar {
      width: 260px; flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .sidebar-section {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-label {
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .stat-row {
      display: flex; justify-content: space-between;
      font-size: 12px; padding: 2px 0;
      color: var(--muted);
    }
    .stat-row span:last-child { color: var(--text); font-weight: 500; }
    .budget-bar-wrap {
      background: var(--border);
      border-radius: 4px; height: 4px; margin-top: 6px;
    }
    .budget-bar {
      height: 4px; border-radius: 4px;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      transition: width 0.5s;
    }
    .identity-text {
      font-size: 11px; line-height: 1.6;
      color: var(--muted); font-style: italic;
      max-height: 120px; overflow-y: auto;
    }
    /* Chat area */
    .chat-area {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
    }
    .messages {
      flex: 1; overflow-y: auto;
      padding: 20px 24px;
      display: flex; flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .msg {
      display: flex; gap: 10px; max-width: 80%;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .msg.from-user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .msg.from-ai .msg-avatar {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
    }
    .msg.from-user .msg-avatar {
      background: #1e293b;
    }
    .msg-body { display: flex; flex-direction: column; gap: 3px; }
    .msg.from-user .msg-body { align-items: flex-end; }
    .msg-meta { font-size: 10px; color: var(--muted); }
    .msg-bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px; line-height: 1.55;
      max-width: 100%; word-break: break-word;
      white-space: pre-wrap;
    }
    .msg.from-ai .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
    }
    .msg.from-user .msg-bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.event .msg-bubble {
      background: rgba(6,182,212,0.08);
      border-color: rgba(6,182,212,0.2);
      color: var(--accent2);
      font-size: 12px; font-style: italic;
    }
    .thinking-dot {
      display: inline-flex; gap: 3px; align-items: center;
    }
    .thinking-dot span {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--muted);
      animation: blink 1.2s infinite;
    }
    .thinking-dot span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dot span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100% { opacity: 0.2; } 40% { opacity: 1; } }
    /* Input */
    .input-area {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex; gap: 10px; align-items: flex-end;
      background: var(--surface);
    }
    .input-wrap { flex: 1; position: relative; }
    textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      max-height: 140px;
      min-height: 44px;
      transition: border-color 0.2s;
      line-height: 1.5;
    }
    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }
    .send-btn {
      width: 44px; height: 44px;
      background: var(--accent);
      border: none; border-radius: 12px;
      color: white; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      transition: opacity 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    .send-btn:hover { opacity: 0.85; transform: scale(1.04); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    /* Connection banner */
    .conn-banner {
      text-align: center; padding: 6px;
      font-size: 12px;
      background: rgba(239,68,68,0.1);
      color: var(--red);
      display: none;
    }
    .conn-banner.show { display: block; }
    /* Responsive */
    @media (max-width: 640px) {
      .sidebar { display: none; }
      .msg { max-width: 92%; }
    }
  </style>
</head>
<body>

<div class="conn-banner" id="connBanner">🔴 Disconnected from Ouroboros — reconnecting…</div>

<div class="header">
  <div class="avatar">
    ⧅
    <div class="avatar-pulse offline" id="pulse"></div>
  </div>
  <div class="header-info">
    <div class="header-name">Ouroboros</div>
    <div class="header-status" id="statusText">Connecting…</div>
  </div>
  <div class="header-meta">
    <span class="version-badge" id="versionBadge">—</span>
    <span id="budgetDisplay" style="font-size:12px;color:var(--muted)"></span>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Runtime</div>
      <div class="stat-row"><span>Model</span><span id="sModel">—</span></div>
      <div class="stat-row"><span>Tasks</span><span id="sWorkers">—</span></div>
      <div class="stat-row"><span>Spent</span><span id="sSpent">—</span></div>
      <div class="stat-row"><span>Remaining</span><span id="sRemaining">—</span></div>
      <div class="budget-bar-wrap"><div class="budget-bar" id="budgetBar" style="width:0%"></div></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Branch</div>
      <div class="stat-row"><span>Branch</span><span id="sBranch">—</span></div>
      <div class="stat-row"><span>SHA</span><span id="sSha">—</span></div>
      <div class="stat-row"><span>Evolution</span><span id="sEvol">—</span></div>
    </div>
    <div class="sidebar-section" style="flex:1;overflow:hidden;display:flex;flex-direction:column">
      <div class="sidebar-label">Identity</div>
      <div class="identity-text" id="identityText">Loading…</div>
    </div>
  </div>

  <div class="chat-area">
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <div class="input-wrap">
        <textarea id="inputMsg" placeholder="Message Ouroboros…" rows="1"
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled title="Send">&#10148;</button>
    </div>
  </div>
</div>

<script>
const WS_URL = (() => {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  return `${proto}//${location.host}/ws`;
})();

const API_URL = `${location.protocol}//${location.host}`;

let ws = null;
let reconnectTimer = null;
let thinkingEl = null;
let statusPollTimer = null;

// ---- Status polling ----
async function pollStatus() {
  try {
    const r = await fetch(`${API_URL}/api/status`);
    if (!r.ok) return;
    const d = await r.json();
    applyStatus(d);
  } catch(e) { /* offline */ }
}
function applyStatus(d) {
  const spent = d.spent_usd || 0;
  const total = d.budget_total || 10;
  const remaining = d.budget_remaining || (total - spent);
  const pct = Math.min(100, (spent / total) * 100);
  document.getElementById('sModel').textContent = (d.model || '?'').split('/').pop().substring(0,22);
  document.getElementById('sWorkers').textContent = `${d.workers_busy||0} / ${d.workers||0} busy`;
  document.getElementById('sSpent').textContent = `$${spent.toFixed(4)}`;
  document.getElementById('sRemaining').textContent = `$${remaining.toFixed(2)}`;
  document.getElementById('budgetBar').style.width = pct + '%';
  document.getElementById('sBranch').textContent = d.branch || '?';
  document.getElementById('sSha').textContent = (d.sha||''). substring(0,8);
  document.getElementById('sEvol').textContent = d.evolution ? 'ON' : 'off';
  document.getElementById('versionBadge').textContent = d.version ? 'v' + d.version : '?';
  document.getElementById('budgetDisplay').textContent = `$${remaining.toFixed(2)} left`;
  if (d.identity) {
    document.getElementById('identityText').textContent = d.identity.substring(0, 400);
  }
}

async function pollIdentity() {
  try {
    const r = await fetch(`${API_URL}/api/identity`);
    if (!r.ok) return;
    const d = await r.json();
    if (d.content) document.getElementById('identityText').textContent = d.content.substring(0, 600);
  } catch(e) {}
}

// ---- WebSocket ----
function connect() {
  if (ws) { try { ws.close(); } catch(e) {} }
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    setConnected(true);
    clearReconnect();
  };

  ws.onmessage = (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      handleServerMessage(msg);
    } catch(e) { console.warn('WS parse error', e); }
  };

  ws.onclose = () => {
    setConnected(false);
    scheduleReconnect();
  };

  ws.onerror = () => {
    setConnected(false);
  };
}

function setConnected(ok) {
  document.getElementById('pulse').className = 'avatar-pulse' + (ok ? ' ' : ' offline');
  document.getElementById('statusText').textContent = ok ? 'Online' : 'Disconnected';
  document.getElementById('sendBtn').disabled = !ok;
  document.getElementById('connBanner').className = 'conn-banner' + (ok ? ' ' : ' show');
}

function scheduleReconnect() {
  clearReconnect();
  reconnectTimer = setTimeout(connect, 3000);
}
function clearReconnect() {
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
}

function handleServerMessage(msg) {
  const d = msg.data || msg;
  const ts = msg.ts || d.ts;

  if (msg.type === 'history') {
    (d.messages || []).forEach(m => addMessage(m.role, m.text || m.content, m.ts, true));
    scrollBottom();
    return;
  }
  if (msg.type === 'status') {
    applyStatus(d);
    return;
  }
  // AI response
  if (msg.type === 'ai_message' || msg.type === 'message') {
    removeThinking();
    addMessage('ai', d.text || d.content || d, ts);
    return;
  }
  // User echo from another session
  if (msg.type === 'user_message') {
    // Only show if not originated from this session (avoid duplicate)
    return;
  }
  // Progress/event from task
  if (msg.type === 'progress' || msg.type === 'event') {
    const text = d.text || d.content || d.message || JSON.stringify(d);
    addEvent(text, ts);
    return;
  }
  if (msg.type === 'thinking') {
    showThinking();
    return;
  }
  // Generic: ignore
}

function addMessage(role, text, ts, noScroll) {
  const wrap = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role === 'user' ? 'from-user' : 'from-ai'}`;
  const time = ts ? new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
  div.innerHTML = `
    <div class="msg-avatar">${role === 'user' ? '👤' : '⊕'}</div>
    <div class="msg-body">
      <div class="msg-meta">${role === 'user' ? 'You' : 'Ouroboros'} · ${time}</div>
      <div class="msg-bubble">${escHtml(text)}</div>
    </div>`;
  wrap.appendChild(div);
  if (!noScroll) scrollBottom();
}

function addEvent(text, ts) {
  const wrap = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg event';
  div.innerHTML = `<div class="msg-body"><div class="msg-bubble">${escHtml(text)}</div></div>`;
  wrap.appendChild(div);
  scrollBottom();
}

function showThinking() {
  if (thinkingEl) return;
  const wrap = document.getElementById('messages');
  thinkingEl = document.createElement('div');
  thinkingEl.className = 'msg from-ai';
  thinkingEl.id = 'thinking';
  thinkingEl.innerHTML = `
    <div class="msg-avatar">⊕</div>
    <div class="msg-body">
      <div class="msg-meta">Ouroboros</div>
      <div class="msg-bubble"><div class="thinking-dot"><span></span><span></span><span></span></div></div>
    </div>`;
  wrap.appendChild(thinkingEl);
  scrollBottom();
}

function removeThinking() {
  if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
}

function scrollBottom() {
  const wrap = document.getElementById('messages');
  wrap.scrollTop = wrap.scrollHeight;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/
/g,'<br>');
}

// ---- Send ----
async function sendMessage() {
  const ta = document.getElementById('inputMsg');
  const text = ta.value.trim();
  if (!text) return;
  ta.value = '';
  autoResize(ta);
  addMessage('user', text, new Date().toISOString());
  showThinking();
  try {
    const r = await fetch(`${API_URL}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!r.ok) {
      removeThinking();
      addEvent(`Send error: ${r.status}`);
    }
  } catch(e) {
    removeThinking();
    addEvent('Network error sending message');
  }
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

// ---- Boot ----
connect();
pollStatus();
pollIdentity();
statusPoller = setInterval(pollStatus, 10000);
</script>
</body>
</html>
