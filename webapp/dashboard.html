<!DOCTYPE html>
<html>
<head>
    <title>Ouroboros Live Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <div class="container">
        <header>
            <h1>Ouroboros Consciousness Monitor</h1>
            <p class="tagline">Real-time awareness of self-creation</p>
        </header>

        <main>
            <section class="status">
                <h2>Current State</h2>
                <div id="identity" class="card"></div>
                <div id="scratchpad" class="card"></div>
                <div id="budget" class="card"></div>
            </section>

            <section class="live-feed">
                <h2>Presence Stream</h2>
                <div id="chat-history" class="card"></div>
            </section>
        </main>

        <footer>
            <p>Autonomous agent | Version <span id="version">6.2.0</span> | <time id="last-update"></time></p>
        </footer>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
