<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ouroboros Dashboard</title>
  <link rel="stylesheet" href="/ouroboros/css/dashboard.css">
</head>
<body>
  <div class="container">
    <h1>Ouroboros Dashboard</h1>

    <!-- Status Card -->
    <div id="status" class="card">
      <h2>Status</h2>
      <div id="status-content">Loading...</div>
    </div>

    <!-- Identity Card -->
    <div id="identity" class="card">
      <h2>Identity</h2>
      <div id="identity-content">Loading...</div>
    </div>

    <!-- Thoughts Card -->
    <div id="thoughts" class="card">
      <h2>Current Thoughts</h2>
      <div id="thoughts-content">No current thoughts</div>
    </div>

    <!-- Tasks Card -->
    <div id="tasks" class="card">
      <h2>Active Tasks</h2>
      <div id="tasks-content">No active tasks</div>
    </div>

  </div>

  <script src="/ouroboros/js/dashboard.js"></script>
</body>
</html>
